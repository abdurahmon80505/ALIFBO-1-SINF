<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF8F0">
<title>Ovoz studiyasi — Alifbo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
<style>
  .yqator{
    display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--fon2);
    border-radius:14px;box-shadow:var(--soya);margin-bottom:8px;
  }
  .yqator.bor{background:var(--yashil-och)}
  .yqator .nom{
    font-family:'Baloo 2',cursive;font-size:23px;font-weight:700;min-width:62px;
  }
  .yqator .izo{flex:1;font-size:12.5px;color:var(--matn2);line-height:1.35;min-width:0}
  .yqator .amal{display:flex;gap:6px;flex:none}
  .kbtn{
    width:42px;height:42px;border-radius:12px;background:var(--fon);
    font-size:17px;box-shadow:var(--soya);display:flex;align-items:center;justify-content:center;
  }
  .kbtn.yoz{background:var(--asos);color:#fff}
  .kbtn.yozilyapti{background:var(--xato);color:#fff;animation:puls .8s infinite}
  @keyframes puls{50%{opacity:.55}}
  .kbtn:disabled{opacity:.35}
  .bolim{display:flex;gap:7px;margin-bottom:12px}
  .bolim button{flex:1;padding:11px 4px;border-radius:13px;background:var(--fon2);
    font-weight:800;font-size:13.5px;box-shadow:var(--soya);color:var(--matn2)}
  .bolim button.on{background:var(--siyoh);color:#fff}
  .katta-yoz{
    position:fixed;inset:0;z-index:70;background:var(--fon);display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;
  }
  .katta-yoz.ochiq{display:flex}
  .katta-yoz .harf{font-family:'Baloo 2',cursive;font-size:110px;font-weight:800;color:var(--asos);line-height:1}
  .katta-yoz .izo{font-size:16px;color:var(--matn2);text-align:center;max-width:320px;line-height:1.5}
  .katta-yoz .hisob{font-size:14px;color:var(--matn2);font-weight:800}
  .dumaloq{
    width:110px;height:110px;border-radius:50%;background:var(--xato);color:#fff;
    font-size:38px;display:flex;align-items:center;justify-content:center;box-shadow:var(--soya2);
  }
  .dumaloq.yozilyapti{animation:puls .8s infinite;background:#B02A2E}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="logo">🎙️ STUDIYA</div>
    <div class="yulduzlar" id="hisob">0 / 0</div>
    <button class="gear" onclick="location.href='index.html'">✕</button>
  </div>

  <div class="karta">
    <div class="sarlavha">Oʻz ovozingizni yozing</div>
    <div class="izoh">Bola tanish ovozni eshitsa — tezroq oʻrganadi.
    Har bir harfni bosing, tovushni ayting, yana bosing. Xolos.<br><br>
    <b>Muhim:</b> harfning <b>nomini emas, tovushini</b> ayting — "be" emas, <b>"b"</b>.</div>
    <div class="tugmalar">
      <button class="tugma" id="btnKetma">▶️ Ketma-ket yozish</button>
      <button class="tugma oq" id="btnOchir">🗑 Tozalash</button>
    </div>
  </div>

  <div id="ogoh"></div>

  <div class="bolim">
    <button class="on" data-b="harf">Harflar</button>
    <button data-b="bogin">Boʻgʻinlar</button>
    <button data-b="soz">Soʻzlar</button>
  </div>

  <div id="royxat"></div>
</div>

<div class="katta-yoz" id="kattaYoz">
  <div class="hisob" id="kyHisob"></div>
  <div class="harf" id="kyHarf"></div>
  <div class="izo" id="kyIzoh"></div>
  <button class="dumaloq" id="kyTugma">🎙</button>
  <div class="tugmalar">
    <button class="tugma oq" id="kyOtkaz">Oʻtkazib yuborish →</button>
    <button class="tugma oq" id="kyYop">Toʻxtatish</button>
  </div>
</div>

<script type="module" src="js/yozish.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
