<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF8F0">
<title>Ota-ona paneli — Alifbo</title>
<script>
try {
  var m = localStorage.getItem('alifboMavzu') || 'avto';
  if (m !== 'avto') document.documentElement.dataset.mavzu = m;
} catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
<style>
  .katak4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
  .katak{background:var(--fon2);border-radius:16px;padding:14px;box-shadow:var(--soya)}
  .katak .son{font-family:'Baloo 2',cursive;font-size:30px;font-weight:800;line-height:1.1}
  .katak .yor{font-size:12.5px;color:var(--matn2);font-weight:700;margin-top:2px}
  .grafik{display:flex;align-items:flex-end;gap:7px;height:120px;margin:14px 0 6px}
  .ustun{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
  .ustun i{display:block;width:100%;background:var(--yashil);border-radius:7px 7px 3px 3px;min-height:3px;font-style:normal}
  .ustun i.bosh{background:var(--chiziq)}
  .ustun small{font-size:10.5px;color:var(--matn2);font-weight:700}
  .ustun b{font-size:11px;color:var(--matn2)}
  .harflar{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .hbelgi{
    padding:7px 12px;border-radius:11px;font-family:'Baloo 2',cursive;font-size:19px;font-weight:700;
    background:var(--fon);box-shadow:var(--soya);display:flex;align-items:baseline;gap:6px;
  }
  .hbelgi span{font-family:'Nunito';font-size:11.5px;font-weight:700;color:var(--matn2)}
  .hbelgi.yomon{background:var(--yomon-fon);color:var(--xato)}
  .hbelgi.yaxshi{background:var(--yashil-och);color:var(--yashil)}
  .maslahat{background:var(--maslahat-fon);border:1.5px solid var(--maslahat-chiziq);border-radius:14px;padding:12px 14px;
    font-size:13.5px;font-weight:600;line-height:1.6;margin-bottom:10px}
  .maslahat b{color:var(--kok)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="logo">👨‍👩‍👧 PANEL</div>
    <div class="yulduzlar" id="ism"></div>
    <button class="gear" onclick="location.href='index.html'">✕</button>
  </div>
  <div id="ich"></div>
</div>
<script type="module" src="js/ota-ona.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
